<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parcel Box QR</title>
<style>body{font-family:system-ui,sans-serif;max-width:420px;margin:0 auto;padding:16px;text-align:center}
button{font-size:1.1rem;padding:.7rem 1.4rem;border:0;border-radius:8px;background:#06c755;color:#fff}
#qr svg{width:260px;height:260px}#msg{color:#555;margin:1rem 0}</style></head>
<body>
<h2>📦 สร้าง QR สำหรับผู้ส่งพัสดุ</h2>
<p id="msg">กำลังโหลด…</p>
<select id="box" hidden></select>
<p><button id="go" hidden>สร้าง QR (ใช้ได้ 24 ชม.)</button></p>
<div id="qr"></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const msg = (t) => ($("msg").textContent = t);
async function api(path, opts = {}) {
  const r = await fetch("/api/liff" + path, { ...opts, headers: { "Content-Type": "application/json",
    Authorization: "Bearer " + liff.getIDToken() } });
  if (r.status === 401) {
    // Stale/expired ID token (LIFF keeps it in the browser): sign in again once, automatically.
    let tried = false;
    try { tried = sessionStorage.getItem("liff_relogin") === "1"; sessionStorage.setItem("liff_relogin", "1"); } catch (e) {}
    if (!tried) { liff.logout(); liff.login({ redirectUri: location.origin + "/liff" }); return new Promise(() => {}); }
  } else {
    try { sessionStorage.removeItem("liff_relogin"); } catch (e) {}
  }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}
(async () => {
  try {
    const { liff_id } = await (await fetch("/api/liff/config")).json();
    await liff.init({ liffId: liff_id });
    if (!liff.isLoggedIn()) return liff.login();
    const { boxes } = await api("/me");
    if (!boxes.length) return msg("ยังไม่ได้เชื่อมกับตู้ — โปรดติดต่อผู้ดูแลระบบ");
    boxes.forEach((b) => $("box").add(new Option(b, b)));
    $("box").hidden = boxes.length < 2; $("go").hidden = false; msg("พร้อมสร้าง QR");
    $("go").onclick = async () => {
      try {
        const q = await api("/qr", { method: "POST", body: JSON.stringify({ box_id: $("box").value }) });
        $("qr").innerHTML = q.qr_svg;  // SVG generated by our own server
        msg("หมดอายุ: " + new Date(q.expires_at).toLocaleString("th-TH"));
      } catch (e) { msg("ผิดพลาด: " + e.message); }
    };
  } catch (e) { msg("ผิดพลาด: " + e.message); }
})();
</script></body></html>
