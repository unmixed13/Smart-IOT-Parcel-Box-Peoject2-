<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1290" viewBox="0 0 1300 1290" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="36" font-size="22" font-weight="bold" fill="#111">Complete circuit: ESP32 + GM66 + reed + buzzer + ESP32-CAM + solenoid lock + 12 V power</text>
<text x="30" y="60" font-size="13" fill="#555">Labels "+5V" (red) all join the XL4015 5.0 V output; every "GND" joins the one common GND rail at the bottom. 12 V goes ONLY to the solenoid and the XL4015 input.</text>
<rect x="80" y="80" width="200" height="680" rx="8" fill="#eef3fb" stroke="#245" stroke-width="2.5"/>
<text x="180" y="110" font-size="17" fill="#111" text-anchor="middle" font-weight="bold">ESP32 DevKit</text>
<text x="180" y="130" font-size="12" fill="#555" text-anchor="middle" font-weight="normal">(main controller)</text>
<line x1="280" y1="160" x2="300" y2="160" stroke="#222" stroke-width="2"/>
<text x="272" y="164" font-size="12" fill="#111" text-anchor="end" font-weight="normal">VIN</text>
<line x1="280" y1="200" x2="300" y2="200" stroke="#222" stroke-width="2"/>
<text x="272" y="204" font-size="12" fill="#111" text-anchor="end" font-weight="normal">GND</text>
<line x1="280" y1="250" x2="300" y2="250" stroke="#222" stroke-width="2"/>
<text x="272" y="254" font-size="12" fill="#111" text-anchor="end" font-weight="normal">GPIO17 (TX2)</text>
<line x1="280" y1="290" x2="300" y2="290" stroke="#222" stroke-width="2"/>
<text x="272" y="294" font-size="12" fill="#111" text-anchor="end" font-weight="normal">GPIO16 (RX2)</text>
<line x1="280" y1="420" x2="300" y2="420" stroke="#222" stroke-width="2"/>
<text x="272" y="424" font-size="12" fill="#111" text-anchor="end" font-weight="normal">GPIO25  DOOR_SW</text>
<line x1="280" y1="480" x2="300" y2="480" stroke="#222" stroke-width="2"/>
<text x="272" y="484" font-size="12" fill="#111" text-anchor="end" font-weight="normal">GPIO32  UNLOCK_BTN</text>
<line x1="280" y1="560" x2="300" y2="560" stroke="#222" stroke-width="2"/>
<text x="272" y="564" font-size="12" fill="#111" text-anchor="end" font-weight="normal">GPIO13  BUZZ_SIG</text>
<line x1="280" y1="670" x2="300" y2="670" stroke="#222" stroke-width="2"/>
<text x="272" y="674" font-size="12" fill="#111" text-anchor="end" font-weight="normal">GPIO14  CAM_TRIG</text>
