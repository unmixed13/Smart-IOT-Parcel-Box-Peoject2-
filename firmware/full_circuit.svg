<line x1="600" y1="1100" x2="650" y2="1100" stroke="#222" stroke-width="3"/><text x="656" y="1104" font-size="13" font-weight="bold">GND (OUT-)</text>
<!-- GND rail -->
<line x1="40" y1="1240" x2="1100" y2="1240" stroke="#222" stroke-width="4"/>
<text x="60" y="1266" font-size="13" font-weight="bold">common GND rail: adapter GND = XL4015 IN-/OUT- = Q1 source = ESP32 GND = every GND label</text>
<text x="30" y="1286" font-size="13" font-weight="bold" fill="#b71c1c">Q1 must be IRLZ44N (logic level), not IRFZ44N. Check all wires against this picture BEFORE plugging in the adapter.</text>
<text x="478" y="1190" font-size="11" fill="#555">(wires crossing here are NOT connected)</text></svg>