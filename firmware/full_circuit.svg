<text x="520" y="662" font-size="12" fill="#555" text-anchor="middle">TRIG pulse, 3.3 V (200 ms HIGH after the door closes)</text>
<rect x="800" y="672" width="230" height="140" rx="8" fill="#eef7f9" stroke="#175" stroke-width="2.5"/>
<text x="915" y="693" font-size="15" text-anchor="middle" font-weight="bold" fill="#111">ESP32-CAM (AI-Thinker)</text>
<line x1="780" y1="716" x2="800" y2="716" stroke="#222" stroke-width="2"/><text x="812" y="720" font-size="12" fill="#111">GPIO13 (TRIG in)</text>
